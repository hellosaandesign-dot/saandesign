<style>
:root { --bg: #f4f6f5; --panel: #fff; --primary: #55625b; --accent: #6b7a72; --text: #4a524d; --border: #e2e5e3; }
body { font-family: Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
.container { width: 95%; max-width: 1100px; background: var(--panel); padding: 40px; border-radius: 12px; margin: 0 auto; box-shadow: 0 8px 30px rgba(0,0,0,0.03); }
.header { border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
.logo-title { font-size: 28px; font-weight: bold; color: var(--primary); letter-spacing: 1px; }
.status-section { margin-bottom: 35px; }
.status-title { font-size: 16px; font-weight: bold; color: white; padding: 6px 14px; border-radius: 6px; display: inline-block; margin-bottom: 15px; }
.bg-active { background-color: #27ae60; }
.bg-negotiate { background-color: #f39c12; }
.bg-canceled { background-color: #95a5a6; }
table { width: 100%; border-collapse: collapse; margin-bottom: 10px; background: #fafbfa; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
th { background: #f8faf9; color: var(--primary); text-align: left; padding: 12px 15px; border-bottom: 2px solid var(--border); font-size: 14px; }
td { padding: 14px 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
.btn-link { display: inline-block; padding: 6px 12px; background-color: var(--accent); color: white; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; transition: background 0.2s; margin-right: 5px; }
.btn-link:hover { background-color: var(--primary); }
</style>
<style>:root{--primary:#55625b;--primary-color:#55625b;--accent:#6b7a72}*{box-sizing:border-box}body{margin:0;padding:12px;background:#f4f6f5;color:#4a524d;font-family:Arial,sans-serif;overflow-wrap:anywhere}.navbar,.container,main.container{width:100%;max-width:1200px;margin:0 auto 20px}.navbar{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;background:#e5ebe5;border-radius:16px;box-shadow:0 4px 16px #55625b0d}.navbar a{display:block;margin:0;min-height:44px;padding:12px;border:1px solid #dce3de;border-radius:10px;text-align:center;text-decoration:none;color:#55625b;background:white}.navbar a.active,.navbar a[aria-current="page"]{background:#55625b;color:white}.navbar a:hover{background:#cad7cd;color:#34443a}.container{padding:20px;min-width:0;border-radius:18px}.navbar a,button,.btn,.btn-link,.btn-google-photos,.container,.card,.widget-card,.summary-box,.payment-box,.photo-box{transition:all .25s ease;box-shadow:0 3px 12px #55625b12}button:hover,.btn:hover,.btn-link:hover{filter:brightness(.96);box-shadow:0 5px 15px #55625b22}input,select,textarea{max-width:100%;min-width:0;font-size:16px}input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%}textarea{resize:vertical}.input-group,.form-group,.log-section>*,.bottom-grid>*,.meta-grid>*,.top-summary>*,.photo-grid>*{min-width:0}.table-scroll{max-width:100%;width:100%;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;margin-bottom:20px}.table-scroll table{min-width:850px;width:100%}.table-scroll input,.table-scroll select{width:100%!important}.meta-grid,.top-summary,.top-widgets,.bottom-grid,.log-section,.photo-grid,.form-grid{display:grid;grid-template-columns:minmax(0,1fr)!important;gap:18px}.header,.header-main,.qr-footer-box,.photo-action-bar{flex-direction:column;align-items:stretch;gap:16px}.company-info{text-align:left}.btn,.btn-link,.btn-google-photos{width:100%;min-height:44px;margin:4px 0}.btn-remove-photo{min-height:36px!important;display:block!important}.photo-box img{max-width:100%;object-fit:contain}.photo-box{transition:all .25s ease}#qrcode{flex-shrink:0}#qrcode img{max-width:100%}.qr-footer-box{overflow-wrap:anywhere}.runtime-note{font-size:13px;color:#6b5140}.pdf-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.pdf-capture{width:1100px!important;max-width:none!important;padding:28px!important;margin:0!important;background:white!important}.pdf-capture .table-scroll{overflow:visible!important}.pdf-capture table{min-width:0!important;table-layout:fixed!important}.pdf-capture .meta-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.pdf-capture .photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.pdf-capture .log-section,.pdf-capture .bottom-grid{grid-template-columns:1fr!important}.pdf-capture .photo-box img{height:220px}.pdf-capture .photo-box{border-style:solid}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.table-scroll:focus-visible{outline:3px solid #a9bbae;outline-offset:2px}@media(min-width:768px){body{padding:24px}.navbar{grid-template-columns:repeat(4,minmax(0,1fr))}.container{padding:32px}.meta-grid,.top-summary,.photo-grid,.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.btn,.btn-link{width:auto}}@media(min-width:1100px){.navbar{grid-template-columns:repeat(7,minmax(0,1fr))}.header,.header-main,.photo-action-bar{flex-direction:row}.meta-grid,.top-widgets{grid-template-columns:repeat(3,minmax(0,1fr))!important}.bottom-grid{grid-template-columns:minmax(0,1fr) 340px!important}.log-section{grid-template-columns:repeat(2,minmax(0,1fr))!important}.company-info{text-align:right}.qr-footer-box{flex-direction:row}}@media print{.navbar,button{display:none!important}.table-scroll{overflow:visible}.table-scroll table{min-width:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="navbar" role="navigation" aria-label="內部系統導覽"><a href="dashboard.html" data-page="dashboard" class="active" aria-current="page">📊 專案總控</a><a href="index.html" data-page="index">💰 預算請款</a><a href="schedule.html" data-page="schedule">📅 工程進度</a><a href="change-order.html" data-page="change-order">🔄 追加減單</a><a href="vendor.html" data-page="vendor">🪙 利潤暗簿</a><a href="checkout.html" data-page="checkout">🔑 驗收交屋</a><a href="report.html" data-page="report">📝 監工日誌</a></div><script>(() => {
const pages=['dashboard','index','schedule','change-order','vendor','checkout','report'];
function context(path){const file=decodeURIComponent(path.split('/').pop()||'dashboard.html');for(const base of [...pages].sort((a,b)=>b.length-a.length)){if(file===base+'.html')return{base,suffix:''};if(file.startsWith(base+'-')&&file.endsWith('.html'))return{base,suffix:file.slice(base.length,-5)}}return{base:'dashboard',suffix:''}}
const current=context(location.pathname);
document.querySelectorAll('.navbar a[data-page]').forEach(a=>{a.setAttribute('href',a.dataset.page+current.suffix+'.html');a.classList.toggle('active',a.dataset.page===current.base);if(a.dataset.page===current.base)a.setAttribute('aria-current','page')});
document.querySelectorAll('a[target="_blank"]').forEach(a=>a.rel='noopener noreferrer');
function numeric(field){const n=Number(field.value),v=Number.isFinite(n)?Math.max(0,n):0;if(field.value.trim()===''||!Number.isFinite(n)||n<0)field.value=String(v);return v}
document.addEventListener('input',e=>{if(e.target.matches('input[type="number"]'))numeric(e.target)},true);
document.addEventListener('change',e=>{if(e.target.matches('input[type="number"]'))numeric(e.target)},true);
document.addEventListener('DOMContentLoaded',()=>{
document.querySelectorAll('input[type="number"]').forEach(f=>{if(!f.hasAttribute('min'))f.min='0'});
document.querySelectorAll('label').forEach((label,i)=>{const field=label.nextElementSibling;if(field&&field.matches('input,select,textarea')){if(!field.id)field.id='field-'+i;label.htmlFor=field.id}});
document.querySelectorAll('table').forEach(table=>{if(table.parentElement.classList.contains('table-scroll'))return;const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','明細表格，可左右捲動');table.before(wrap);wrap.append(table)});
});
window.Saan={context,numeric,escape:value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
})();
</script>

<script>document.querySelectorAll('.status-section tbody tr').forEach(row=>{const links=[...row.querySelectorAll('a')].filter(a=>/^(index|schedule|change-order|vendor|checkout|report)\.html$/.test(a.getAttribute('href')));if(!links.length)return;const cell=row.lastElementChild,label=document.createElement('label'),field=document.createElement('input');label.textContent='個案路徑／後綴（例如 huang、案件A/ 或 案件A/huang）';field.placeholder='留白使用目前頁面的個案';field.setAttribute('aria-label','個案路徑與後綴');field.addEventListener('change',()=>{const value=field.value.trim();if(value.includes('..')||/[?#:\\]/.test(value)){field.setCustomValidity('請使用相對資料夾或個案代號');field.reportValidity();return}field.setCustomValidity('');const slash=value.lastIndexOf('/'),dir=slash<0?'':value.slice(0,slash+1),suffix=slash<0?value:value.slice(slash+1);links.forEach(a=>{const base=a.dataset.base;a.href=dir+base+(suffix?'-'+suffix: value?'':Saan.context(location.pathname).suffix)+'.html'})});links.forEach(a=>{a.dataset.base=a.getAttribute('href').slice(0,-5);a.href=a.dataset.base+Saan.context(location.pathname).suffix+'.html'});label.append(field);cell.append(label)});</script><section class="container"><h2>⚪ 已取消專案</h2><p>目前未登錄已取消案件。此總控頁尚未接上雲端資料庫，專案清單需在 HTML 中維護。</p></section></body>
