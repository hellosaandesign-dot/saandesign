<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場施工監工日誌 - 象合設計</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <!-- 引入自動生成 QR Code 的黑科技工具，用來隔離業主隱私 -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --bg: #f4f6f5; --panel: #fff; --primary: #55625b; --accent: #6b7a72; --text: #4a524d; --border: #e2e5e3; }
        body { font-family: Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .navbar { background-color: var(--primary); padding: 15px 40px; display: flex; gap: 20px; }
        .navbar a { color: white; text-decoration: none; font-size: 15px; padding: 8px 16px; border-radius: 4px; transition: background 0.2s; }
        .navbar a:hover, .navbar a.active { background-color: rgba(255,255,255,0.2); }
        .container { width: 95%; max-width: 1000px; background: var(--panel); padding: 40px; border-radius: 12px; margin: 40px auto; box-shadow: 0 8px 30px rgba(0,0,0,0.03); }
        .header-main { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 25px; }
        .company-info { text-align: right; font-size: 13px; color: #7a857f; line-height: 1.5; }
        .company-name { font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; background: #f8faf9; padding: 20px; border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 13px; margin-bottom: 6px; color: var(--primary); font-weight: bold; }
        input, select, textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: var(--text); outline: none; background: #fafbfa; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }
        .log-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background-color: #f8faf9; color: var(--primary); text-align: left; padding: 12px 10px; border-bottom: 2px solid var(--border); font-size: 14px; }
        td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .photo-action-bar { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .photo-box { background: #fafbfa; border: 2px dashed var(--border); border-radius: 8px; padding: 15px; text-align: center; position: relative; cursor: pointer; min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        .photo-box img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; display: none; }
        .photo-box span { font-size: 12px; color: #888; margin-top: 5px; }
        .photo-box .btn-remove-photo { position: absolute; top: 5px; right: 5px; background: rgba(217,136,128,0.9); color: white; border: none; border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; display: none; z-index: 10; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-add { background-color: var(--accent); color: white; margin-bottom: 20px; }
        .btn-google-photos { background-color: #4285f4; color: white; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border-radius: 6px; font-size: 14px; padding: 10px 18px; font-weight: bold; }
        .btn-google-photos:hover { background-color: #3571d4; }
        .btn-del { background-color: #d98880; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-pdf { background-color: #4a524d; color: white; width: 100%; padding: 14px; font-size: 16px; margin-top: 30px; font-weight: bold; }
        .qr-footer-box { display: flex; align-items: center; gap: 20px; background: #f8faf9; padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-top: 25px; }
    </style>
</head>
<body>
<div class="navbar">
    <a href="survey.html">📋 需求訪談</a><a href="index.html">💰 預算報價</a><a href="schedule.html">📅 工程進度</a><a href="change-order.html">🔄 追加減單</a><a href="vendor.html">🪙 利潤暗簿</a><a href="checkout.html">🔑 驗收交屋</a><a href="report.html" class="active">📝 監工日誌</a>
</div>
<div class="container" id="invoice-panel">
    <div class="header-main">
        <div>
            <div style="font-size: 26px; font-weight: bold; color: var(--primary); letter-spacing: 1px;">現場施工監工日誌紀錄表</div>
            <div style="font-size: 12px; color: #888; margin-top: 5px;">象合設計 - 每日案場進度、施工作業與進場人數控管</div>
        </div>
        <div class="company-info">
            <div class="company-name">象合設計</div>
            <div>聯絡信箱：hello.saandesign@gmail.com</div>
        </div>
    </div>
    <div class="meta-grid">
        <div class="input-group"><label>專案名稱</label><input type="text" id="projName" value="美村路黃宅設計案"></div>
        <div class="input-group"><label>監工日期</label><input type="date" id="reportDate" value="2026-10-29"></div>
        <div class="input-group"><label>本日天氣</label><select id="weather"><option>☀️ 晴天</option><option>☁️ 陰天</option><option>🌧️ 雨天</option></select></div>
        <div class="input-group"><label>現場監工人員</label><input type="text" id="supervisor" value="象合設計團隊"></div>
    </div>
    <div style="background:#edf3f0; padding:20px; border-radius:8px; border:1px solid #c2d6cc; margin-bottom:25px;">
        <div class="input-group">
            <label style="color:#2c3e50;">🔒 本個案專屬 Google 相簿網址 (隔離隱私用)</label>
            <input type="text" id="albumUrl" placeholder="請在此貼上本個案在 Google 相簿的分享連結" style="background:#fff; border-color:#99bda8;" oninput="syncAlbumUrl()">
        </div>
    </div>
    <div class="log-section">
        <div>
            <div style="font-weight:bold; color:var(--primary); margin-bottom:12px; font-size:15px;">👷 本日進場施工明細</div>
            <table id="vendorTable">
                <thead>
                    <tr>
                        <th style="width: 35%;">進場工種</th><th style="width: 25%;">出工點數 (人)</th><th style="width: 30%;">負責施作範圍</th><th style="width: 10%;"></th>
                    </tr>
                </thead>
                <tbody id="vendorBody"></tbody>
            </table>
            <button class="btn btn-add" onclick="addRow()">＋ 新增進場工班</button>
        </div>
        <div>
            <div style="font-weight:bold; color:var(--primary); margin-bottom:12px; font-size:15px;">📝 本日施工進度與記事</div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>本日施作主要進度內容描述</label>
                <textarea id="workProgress" rows="4" placeholder="請詳細敘述今日各工種完成的具體進度項目..."></textarea>
            </div>
            <div class="input-group">
                <label>材料進場紀錄 / 業主交代 / 特別備註項目</label>
                <textarea id="workNotes" rows="3" placeholder="例如：水電線料進場查驗無誤..."></textarea>
            </div>
        </div>
    </div>
    <div style="border-top:1px solid var(--border); padding-top:20px;">
        <div class="photo-action-bar">
            <div style="font-weight:bold; color:var(--primary); font-size:15px;">📸 現場施工作業照片紀錄</div>
            <a href="https://google.com" target="_blank" id="photoLink" class="btn-google-photos">
                📂 開啟象合雲端個案相簿
            </a>
            <button class="btn btn-add" style="margin:0;" onclick="createPhotoBox()">＋ 增加照片格</button>
        </div>
        <div class="photo-grid" id="photoGrid"></div>
    </div>
    <div class="qr-footer-box" id="qrContainer" style="display:none;">
        <div id="qrcode"></div>
        <div>
            <div style="font-weight:bold; color:var(--primary); font-size:14px; margin-bottom:5px;">📱 象合設計雲端相簿直達通道</div>
            <div style="font-size:12px; color:#666; line-height:1.5;">本案專屬雲端高畫質施工相簿已與後台連動。<br>業主可直接透過手機掃描左側 QR Code，即時查閱現場完整歷史工藝照片紀錄。</div>
        </div>
    </div>
    <button class="btn btn-pdf" onclick="exportPDF()">一鍵生成本日監工日誌 PDF</button>
</div>
<script>
    const df = [
        { c: "水電工程", n: 2, w: "客廳迴路配管與開關底盒定位" },
        { c: "木作工程", n: 3, w: "天花板矽酸鈣板封板與窗簾盒結構" }
    ];
    let photoCount = 0;
    let qr = null;
    function init() { 
        df.forEach(x => addRow(x.c, x.n, x.w)); 
        for(let i=0; i<3; i++) { createPhotoBox(); }
        qr = new QRCode(document.getElementById("qrcode"), { width: 85, height: 85 });
    }
    function addRow(c="木作工程", n=1, w="") {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><select class="c"><option ${c=="保護/拆除"?'selected':''}>保護/拆除</option><option ${c=="泥作工程"?'selected':''}>泥作工程</option><option ${c=="水電工程"?'selected':''}>水電工程</option><option ${c=="木作工程"?'selected':''}>木作工程</option><option ${c=="油漆工程"?'selected':''}>油漆工程</option><option ${c=="系統工程"?'selected':''}>系統工程</option></select></td>
            <td><input type="number" step="0.5" value="${n}" style="width:70%; text-align:center;"></td>
            <td><input type="text" value="${w}" style="width:90%;" placeholder="施作範圍"></td>
            <td><button class="btn btn-del" onclick="del(this)">X</button></td>`;
        document.getElementById('vendorBody').appendChild(tr);
    }
    function del(b) { b.parentNode.parentNode.remove(); }
    function syncAlbumUrl() {
        const url = document.getElementById('albumUrl').value.trim();
        const link = document.getElementById('photoLink');
        if(url) {
            link.href = url;
            document.getElementById('qrContainer').style.display = 'flex';
            qr.makeCode(url);
        } else {
            link.href = "https://google.com";
            document.getElementById('qrContainer').style.display = 'none';
        }
    }
    function createPhotoBox() {
        photoCount++; const id = photoCount; const box = document.createElement('div');
        box.className = "photo-box"; box.id = 'pbox_' + id; box.setAttribute('onclick', `triggerFile(${id}, event)`);
        box.innerHTML = `
            <input type="file" id="file_${id}" accept="image/*" style="display:none;" onchange="previewImg(this, ${id})">
            <button class="btn-remove-photo" id="rem_${id}" onclick="removePhotoBox(${id}, event)">移除</button>
            <div id="text_${id}">📷 點擊拍照/上傳<br><span>【工程相片 ${id}】</span></div>
            <img id="img_${id}">`;
        document.getElementById('photoGrid').appendChild(box);
    }
    function removePhotoBox(id, e) { e.stopPropagation(); document.getElementById('pbox_' + id).remove(); }
    function triggerFile(id, e) { if(e.target.className === 'btn-remove-photo') return; document.getElementById('file_' + id).click(); }
    function previewImg(input, id) {
        if (input.files && input.files[0]) {
            const r = new FileReader();
            r.onload = function(e) {
                document.getElementById('img_' + id).src = e.target.result;
                document.getElementById('img_' + id).style.display = 'block';
                document.getElementById('text_' + id).style.display = 'none';
                document.getElementById('rem_' + id).style.display = 'block';
            }
            r.readAsDataURL(input.files[0]);
        }
    }
    function exportPDF() {
        const el = document.getElementById('invoice-panel'), btns = document.querySelectorAll('.btn'), rems = document.querySelectorAll('.btn-remove-photo'), link = document.getElementById('photoLink');
        btns.forEach(b => b.style.display = 'none'); rems.forEach(r => r.style.display = 'none'); link.style.display = 'none';
        html2canvas(el, { scale: 2, useCORS: true }).then(canvas => {
            const img = canvas.toDataURL('image/png'), pdf = new window.jspdf.jsPDF('p', 'mm', 'a4'), w = 210, h = canvas.height * w / canvas.width;
            pdf.addImage(img, 'PNG', 0, 0, w, h);
            pdf.save(`施工監工日誌_${document.getElementById('reportDate').value}.pdf`);
            btns.forEach(b => b.style.display = ''); link.style.display = 'flex';
            document.querySelectorAll('.photo-box').forEach(box => {
                const id = box.id.split('_')[1];
                if(document.getElementById('img_' + id).style.display === 'block') { document.getElementById('rem_' + id).style.display = 'block'; }
            });
        });
    }
    window.onload = init;
</script>
</body>
</html>
