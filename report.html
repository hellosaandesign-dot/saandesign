<style>
:root { --bg: #f4f6f5; --panel: #fff; --primary: #55625b; --accent: #6b7a72; --text: #4a524d; --border: #e2e5e3; }
body { font-family: Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
.navbar { background-color: var(--primary); padding: 15px 40px; display: flex; gap: 20px; }
.navbar a { color: white; text-decoration: none; font-size: 15px; padding: 8px 16px; border-radius: 4px; transition: background 0.2s; }
.navbar a:hover, .navbar a.active { background-color: rgba(255,255,255,0.2); }
.container { width: 95%; max-width: 1000px; background: var(--panel); padding: 40px; border-radius: 12px; margin: 40px auto; box-shadow: 0 8px 30px rgba(0,0,0,0.03); }
.header-main { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 25px; }
.company-info { text-align: right; font-size: 13px; color: #7a857f; line-height: 1.5; }
.company-name { font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; background: #f8faf9; padding: 20px; border-radius: 8px; }
.input-group { display: flex; flex-direction: column; }
.input-group label { font-size: 13px; margin-bottom: 6px; color: var(--primary); font-weight: bold; }
input, select, textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: var(--text); outline: none; background: #fafbfa; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }
.log-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 25px; }
table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
th { background-color: #f8faf9; color: var(--primary); text-align: left; padding: 12px 10px; border-bottom: 2px solid var(--border); font-size: 14px; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.photo-action-bar { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
.photo-box { background: #fafbfa; border: 2px dashed var(--border); border-radius: 8px; padding: 15px; text-align: center; position: relative; cursor: pointer; min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
.photo-box img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; display: none; }
.photo-box span { font-size: 12px; color: #888; margin-top: 5px; }
.photo-box .btn-remove-photo { position: absolute; top: 5px; right: 5px; background: rgba(217,136,128,0.9); color: white; border: none; border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; display: none; z-index: 10; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
.btn-add { background-color: var(--accent); color: white; margin-bottom: 20px; }
.btn-google-photos { background-color: #4285f4; color: white; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border-radius: 6px; font-size: 14px; padding: 10px 18px; font-weight: bold; }
.btn-google-photos:hover { background-color: #3571d4; }
.btn-del { background-color: #d98880; color: white; padding: 5px 10px; font-size: 12px; }
.btn-pdf { background-color: #4a524d; color: white; width: 100%; padding: 14px; font-size: 16px; margin-top: 30px; font-weight: bold; }
.qr-footer-box { display: flex; align-items: center; gap: 20px; background: #f8faf9; padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-top: 25px; }
</style>
<style>:root{--primary:#55625b;--primary-color:#55625b;--accent:#6b7a72}*{box-sizing:border-box}body{margin:0;padding:12px;background:#f4f6f5;color:#4a524d;font-family:Arial,sans-serif;overflow-wrap:anywhere}.navbar,.container,main.container{width:100%;max-width:1200px;margin:0 auto 20px}.navbar{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;background:#e5ebe5;border-radius:16px;box-shadow:0 4px 16px #55625b0d}.navbar a{display:block;margin:0;min-height:44px;padding:12px;border:1px solid #dce3de;border-radius:10px;text-align:center;text-decoration:none;color:#55625b;background:white}.navbar a.active,.navbar a[aria-current="page"]{background:#55625b;color:white}.navbar a:hover{background:#cad7cd;color:#34443a}.container{padding:20px;min-width:0;border-radius:18px}.navbar a,button,.btn,.btn-link,.btn-google-photos,.container,.card,.widget-card,.summary-box,.payment-box,.photo-box{transition:all .25s ease;box-shadow:0 3px 12px #55625b12}button:hover,.btn:hover,.btn-link:hover{filter:brightness(.96);box-shadow:0 5px 15px #55625b22}input,select,textarea{max-width:100%;min-width:0;font-size:16px}input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%}textarea{resize:vertical}.input-group,.form-group,.log-section>*,.bottom-grid>*,.meta-grid>*,.top-summary>*,.photo-grid>*{min-width:0}.table-scroll{max-width:100%;width:100%;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;margin-bottom:20px}.table-scroll table{min-width:850px;width:100%}.table-scroll input,.table-scroll select{width:100%!important}.meta-grid,.top-summary,.top-widgets,.bottom-grid,.log-section,.photo-grid,.form-grid{display:grid;grid-template-columns:minmax(0,1fr)!important;gap:18px}.header,.header-main,.qr-footer-box,.photo-action-bar{flex-direction:column;align-items:stretch;gap:16px}.company-info{text-align:left}.btn,.btn-link,.btn-google-photos{width:100%;min-height:44px;margin:4px 0}.btn-remove-photo{min-height:36px!important;display:block!important}.photo-box img{max-width:100%;object-fit:contain}.photo-box{transition:all .25s ease}#qrcode{flex-shrink:0}#qrcode img{max-width:100%}.qr-footer-box{overflow-wrap:anywhere}.runtime-note{font-size:13px;color:#6b5140}.pdf-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.pdf-capture{width:1100px!important;max-width:none!important;padding:28px!important;margin:0!important;background:white!important}.pdf-capture .table-scroll{overflow:visible!important}.pdf-capture table{min-width:0!important;table-layout:fixed!important}.pdf-capture .meta-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.pdf-capture .photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.pdf-capture .log-section,.pdf-capture .bottom-grid{grid-template-columns:1fr!important}.pdf-capture .photo-box img{height:220px}.pdf-capture .photo-box{border-style:solid}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.table-scroll:focus-visible{outline:3px solid #a9bbae;outline-offset:2px}@media(min-width:768px){body{padding:24px}.navbar{grid-template-columns:repeat(4,minmax(0,1fr))}.container{padding:32px}.meta-grid,.top-summary,.photo-grid,.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.btn,.btn-link{width:auto}}@media(min-width:1100px){.navbar{grid-template-columns:repeat(7,minmax(0,1fr))}.header,.header-main,.photo-action-bar{flex-direction:row}.meta-grid,.top-widgets{grid-template-columns:repeat(3,minmax(0,1fr))!important}.bottom-grid{grid-template-columns:minmax(0,1fr) 340px!important}.log-section{grid-template-columns:repeat(2,minmax(0,1fr))!important}.company-info{text-align:right}.qr-footer-box{flex-direction:row}}@media print{.navbar,button{display:none!important}.table-scroll{overflow:visible}.table-scroll table{min-width:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="navbar" role="navigation" aria-label="內部系統導覽"><a href="dashboard.html" data-page="dashboard">📊 專案總控</a><a href="index.html" data-page="index">💰 預算請款</a><a href="schedule.html" data-page="schedule">📅 工程進度</a><a href="change-order.html" data-page="change-order">🔄 追加減單</a><a href="vendor.html" data-page="vendor">🪙 利潤暗簿</a><a href="checkout.html" data-page="checkout">🔑 驗收交屋</a><a href="report.html" data-page="report" class="active" aria-current="page">📝 監工日誌</a></div><script>(() => {
const pages=['dashboard','index','schedule','change-order','vendor','checkout','report'];
function context(path){const file=decodeURIComponent(path.split('/').pop()||'dashboard.html');for(const base of [...pages].sort((a,b)=>b.length-a.length)){if(file===base+'.html')return{base,suffix:''};if(file.startsWith(base+'-')&&file.endsWith('.html'))return{base,suffix:file.slice(base.length,-5)}}return{base:'dashboard',suffix:''}}
const current=context(location.pathname);
document.querySelectorAll('.navbar a[data-page]').forEach(a=>{a.setAttribute('href',a.dataset.page+current.suffix+'.html');a.classList.toggle('active',a.dataset.page===current.base);if(a.dataset.page===current.base)a.setAttribute('aria-current','page')});
document.querySelectorAll('a[target="_blank"]').forEach(a=>a.rel='noopener noreferrer');
function numeric(field){const n=Number(field.value),v=Number.isFinite(n)?Math.max(0,n):0;if(field.value.trim()===''||!Number.isFinite(n)||n<0)field.value=String(v);return v}
document.addEventListener('input',e=>{if(e.target.matches('input[type="number"]'))numeric(e.target)},true);
document.addEventListener('change',e=>{if(e.target.matches('input[type="number"]'))numeric(e.target)},true);
document.addEventListener('DOMContentLoaded',()=>{
document.querySelectorAll('input[type="number"]').forEach(f=>{if(!f.hasAttribute('min'))f.min='0'});
document.querySelectorAll('label').forEach((label,i)=>{const field=label.nextElementSibling;if(field&&field.matches('input,select,textarea')){if(!field.id)field.id='field-'+i;label.htmlFor=field.id}});
document.querySelectorAll('table').forEach(table=>{if(table.parentElement.classList.contains('table-scroll'))return;const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','明細表格，可左右捲動');table.before(wrap);wrap.append(table)});
});
window.Saan={context,numeric,escape:value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
})();
</script>

<div class="container" id="invoice-panel">

</div>

<script>
const df = [
{ c: "水電工程", n: 2, w: "客廳迴路配管與開關底盒定位" },
{ c: "木作工程", n: 3, w: "天花板矽酸鈣板封板與窗簾盒結構" }
];
let photoCount = 0;
let qr = null;
function init() { 
df.forEach(x => addRow(x.c, x.n, x.w)); 
for(let i=0; i<3; i++) { createPhotoBox(); }
syncAlbumUrl();
}
function addRow(c="木作工程", n=1, w="") {
const tr = document.createElement('tr');
tr.innerHTML = `
<td><select class="c"><option ${c=="保護/拆除"?'selected':''}>保護/拆除</option><option ${c=="泥作工程"?'selected':''}>泥作工程</option><option ${c=="水電工程"?'selected':''}>水電工程</option><option ${c=="木作工程"?'selected':''}>木作工程</option><option ${c=="油漆工程"?'selected':''}>油漆工程</option><option ${c=="系統工程"?'selected':''}>系統工程</option></select></td>
<td><input type="number" step="0.5" value="${Saan.escape(n)}" style="width:70%; text-align:center;"></td>
<td><input type="text" value="${Saan.escape(w)}" style="width:90%;" placeholder="施作範圍"></td>
<td><button class="btn btn-del" onclick="del(this)">X</button></td>`;
document.getElementById('vendorBody').appendChild(tr);
}
function del(b) { b.parentNode.parentNode.remove(); }
function createPhotoBox() {
photoCount++; const id = photoCount; const box = document.createElement('div');
box.className = "photo-box"; box.id = 'pbox_' + id; box.setAttribute('onclick', `triggerFile(${id}, event)`);
box.innerHTML = `
<input type="file" id="file_${id}" accept="image/*" style="display:none;" onchange="previewImg(this, ${id})">
<button class="btn-remove-photo" id="rem_${id}" onclick="removePhotoBox(${id}, event)">移除</button>
<div id="text_${id}">📷 點擊拍照/上傳<br><span>【工程相片 ${id}】</span></div>
<img id="img_${id}">`;
document.getElementById('photoGrid').appendChild(box);
}
function removePhotoBox(id, e) { e.stopPropagation(); document.getElementById('pbox_' + id).remove(); }
window.onload = init;
</script>
<script>function syncAlbumUrl(){const field=document.getElementById('albumUrl'),link=document.getElementById('photoLink'),container=document.getElementById('qrContainer'),message=document.getElementById('albumStatus');let url;
link.removeAttribute('href');link.setAttribute('aria-disabled','true');container.style.display='none';if(qr)qr.clear();
try{url=new URL(field.value.trim());if(url.protocol!=='https:'||!['photos.app.goo.gl','photos.google.com'].includes(url.hostname)||url.username||url.password)throw Error('invalid')}catch{message.textContent=field.value.trim()?'請貼上有效的 HTTPS Google 相簿分享網址。':'請先設定本個案相簿網址。';return}
link.href=url.href;link.rel='noopener noreferrer';link.removeAttribute('aria-disabled');
if(typeof QRCode==='undefined'){message.textContent='QR Code 套件未載入，請連線後重新整理；相簿連結仍可開啟。';return}
try{if(!qr)qr=new QRCode(document.getElementById('qrcode'),{width:128,height:128});qr.makeCode(url.href);container.style.display='flex';message.textContent='QR Code 指向此個案相簿；相簿存取權限請在 Google 相簿內設定。'}catch(e){qr?.clear();container.style.display='none';message.textContent='網址過長或 QR Code 生成失敗，請使用相簿的分享短網址。'}
}
function triggerFile(id,e){if(e.target.closest('button,input'))return;document.getElementById('file_'+id).click()}
function previewImg(input,id){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('請選擇圖片檔案。');input.value='';return}const reader=new FileReader();reader.onerror=()=>alert('圖片讀取失敗，請重新選擇。');reader.onload=async()=>{const box=document.getElementById('pbox_'+id);if(!box)return;const test=new Image();test.src=reader.result;try{await test.decode();if(!box.isConnected)return;const img=document.getElementById('img_'+id);img.src=test.src;img.alt='工程相片 '+id;img.style.display='block';document.getElementById('text_'+id).style.display='none';document.getElementById('rem_'+id).style.display='block'}catch{input.value='';alert('此圖片格式無法解碼，請改用 JPEG 或 PNG。')}};reader.readAsDataURL(file)}
let saanExporting=false;
async function exportPDF(){
if(saanExporting)return;
if(typeof html2canvas!=='function'||!window.jspdf?.jsPDF){alert('PDF 套件尚未載入，請確認網路後重新整理。');return}
if(typeof calc==='function')calc();
document.querySelectorAll('input[type="number"]').forEach(Saan.numeric);
if(typeof syncAlbumUrl==='function')syncAlbumUrl();
const root=document.getElementById('invoice-panel'),buttons=[...document.querySelectorAll('.btn-pdf')],states=buttons.map(b=>b.disabled);let copy;
saanExporting=true;buttons.forEach(b=>b.disabled=true);
try{
await document.fonts.ready;
const sourceImages=[...root.querySelectorAll('img')].filter(i=>i.getAttribute('src'));
await Promise.all(sourceImages.map(i=>i.decode()));
copy=root.cloneNode(true);copy.classList.add('pdf-capture');copy.removeAttribute('id');copy.style.position='absolute';copy.style.left='-12000px';copy.style.top='0';copy.setAttribute('aria-hidden','true');
const originalFields=[...root.querySelectorAll('input,select,textarea')];
copy.querySelectorAll('input,select,textarea').forEach((f,i)=>{if(f.type==='file'||f.type==='hidden'){f.remove();return}const s=originalFields[i],text=document.createElement('span');text.className='pdf-text';text.textContent=s.tagName==='SELECT'?s.selectedOptions[0]?.textContent||'—':s.value||'—';f.replaceWith(text)});
copy.querySelectorAll('button,.btn,.btn-remove-photo,#photoLink').forEach(e=>e.remove());
const originals=[...root.querySelectorAll('canvas')];copy.querySelectorAll('canvas').forEach((c,i)=>{const img=document.createElement('img');img.style.cssText=c.style.cssText;img.src=originals[i].toDataURL('image/png');img.width=originals[i].width;img.height=originals[i].height;c.replaceWith(img)});
document.body.append(copy);await Promise.all([...copy.querySelectorAll('img')].filter(i=>i.getAttribute('src')).map(i=>i.decode()));
const pdf=new window.jspdf.jsPDF('p','mm','a4'),width=190,pageHeight=277,pxWidth=copy.offsetWidth,pagePx=Math.floor(pxWidth*pageHeight/width),height=copy.scrollHeight;
const blocks=[...copy.querySelectorAll('tr,.photo-box,.qr-footer-box,.summary-box')].map(e=>{const b=e.getBoundingClientRect(),r=copy.getBoundingClientRect();return{top:b.top-r.top,bottom:b.bottom-r.top}});
for(let offset=0,page=0;offset<height;page++){
let end=Math.min(height,offset+pagePx);const crossing=blocks.filter(b=>b.top>offset+24&&b.top<end&&b.bottom>end&&b.bottom-b.top<=pagePx);if(crossing.length)end=Math.floor(Math.min(...crossing.map(b=>b.top)));
const slice=Math.max(1,end-offset),canvas=await html2canvas(copy,{scale:2,useCORS:true,backgroundColor:'#fff',logging:false,width:pxWidth,height:slice,y:offset,windowWidth:1280,scrollX:0,scrollY:0});
if(page)pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',10,10,width,slice*width/pxWidth);offset+=slice;canvas.width=canvas.height=0;
}
const who=document.getElementById('clientName')?.value||document.getElementById('projName')?.value||'專案',date=document.getElementById('reportDate')?.value||'';
pdf.save(('象合設計_'+document.title+'_'+who+'_'+date).replace(/[\\/:*?"<>|]/g,'_')+'.pdf');
}catch(e){console.error(e);alert('PDF 匯出未完成，請檢查圖片格式或網路後重試；原表單資料仍保留。')}finally{copy?.remove();buttons.forEach((b,i)=>b.disabled=states[i]);saanExporting=false}
}
