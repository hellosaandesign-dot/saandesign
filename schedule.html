<!DOCTYPE html><!-- 檔案：schedule.html -->
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程施工進度動態甘特圖 - 象合設計</title>
<style>
:root{--primary:#55625b;--accent:#6b7a72;--bg:#f4f6f5;--panel:#fff;--text:#4a524d;--border:#dce3de;--chart-bg:#f8faf9}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif;overflow-wrap:anywhere}.navbar,.container{width:100%;max-width:1200px;margin:0 auto 20px}.navbar{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;background:#e5ebe5;border-radius:16px;box-shadow:0 4px 16px #55625b0d}.navbar a,.btn{min-height:44px;padding:10px;border:1px solid var(--border);border-radius:10px;text-align:center;text-decoration:none;background:#fff;color:var(--primary);cursor:pointer;box-shadow:0 2px 8px #55625b0d;transition:all .25s ease}.navbar a:hover,.btn:hover{background:#d9e3da;box-shadow:0 5px 14px #55625b20}.navbar a.active,.btn-add{background:var(--primary);color:#fff}.btn-add:hover{background:#46534c}.container{min-width:0;padding:20px;border:1px solid var(--border);border-radius:18px;background:var(--panel);box-shadow:0 8px 30px #55625b0d;transition:all .25s ease}.header{display:flex;flex-direction:column;gap:16px;padding-bottom:20px;margin-bottom:24px;border-bottom:2px solid var(--accent)}h1{font-size:26px;color:var(--primary);margin:0}.hint{font-size:13px;color:#637269}.project{display:block;min-width:0}.top-widgets,.meta-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:24px}.widget-card,.meta-grid{padding:20px;border:1px solid var(--border);border-radius:12px;background:var(--chart-bg);box-shadow:0 4px 14px #55625b0a;transition:all .25s ease}.widget-card{text-align:center}.w-title{font-size:13px;color:#637269}.w-val{font-size:24px;font-weight:bold;color:var(--primary)}.countdown{background:#fff8eb}.countdown .w-val{color:#965000}.input-group{display:flex;flex-direction:column;min-width:0}.input-group label{font-size:13px;font-weight:bold;margin-bottom:6px}input,select{width:100%;min-width:0;max-width:100%;padding:10px 6px;border:1px solid var(--border);border-radius:8px;background:#fafbf9;color:inherit;font:inherit}input:focus-visible,select:focus-visible,a:focus-visible,button:focus-visible,.table-scroll:focus-visible{outline:3px solid #a9bbae;outline-offset:2px}.table-scroll{min-width:0;width:100%;max-width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overscroll-behavior-x:contain}table{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed}th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:#edf1ec;font-size:13px}th:nth-child(1){width:16%}th:nth-child(2),th:nth-child(3){width:19%}th:nth-child(4){width:10%}th:nth-child(5){width:28%}th:last-child{width:8%}.days{font-weight:bold}.btn-del{color:#963e2b;padding:8px 4px}.btn-add{width:100%}.warning-tag{display:inline-block;padding:5px 8px;border:1px solid #ee7900;border-radius:8px;background:#ff901f;color:#3c2100;font-size:13px;font-weight:bold}.error{color:#a13928}.gantt-wrapper{min-width:0;max-width:100%;overflow-x:auto;background:var(--chart-bg);padding:16px;border:1px solid var(--border);border-radius:12px;margin-top:24px}.gantt-row{margin:16px 0}.gantt-label{font-size:14px;font-weight:bold;margin-bottom:5px}.gantt-timeline{position:relative;width:100%;height:22px;background:#e3e8e3;border-radius:11px;overflow:hidden}.gantt-bar{position:absolute;height:100%;background:var(--accent);border-radius:11px;transition:all .25s ease}.gantt-bar.conflict{background:#f3923d}.gantt-range{font-size:12px;color:#637269}.chart-title{font-weight:bold;color:var(--primary)}
@media(min-width:768px){body{padding:24px}.container{padding:32px}.navbar{grid-template-columns:repeat(4,minmax(0,1fr))}.top-widgets{grid-template-columns:repeat(3,minmax(0,1fr))}.meta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.btn-add{width:auto}}@media(min-width:1100px){.navbar{grid-template-columns:repeat(7,minmax(0,1fr))}.header{flex-direction:row;justify-content:space-between}.project{max-width:280px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="navbar">
    <a href="index.html">💰 預算請款</a><a href="schedule.html" class="active">📅 工程進度</a><a href="change-order.html">🔄 追加減單</a><a href="vendor.html">🪙 利潤暗簿</a><a href="checkout.html">🔑 驗收交屋</a><a href="report.html">📝 監工日誌</a>
</div>
<main class="container"><div class="header"><div><h1>工程施工進度甘特圖總控台</h1><div class="hint">象合設計 - 現場工程進度與工期衝突即時預警系統</div></div><label class="project">專案名稱：<input id="projectName" value="美村路黃宅設計案"></label></div>
<div class="top-widgets" aria-live="polite"><div class="widget-card"><div class="w-title">📅 本案開工日期</div><div class="w-val" id="totalStart">--</div></div><div class="widget-card"><div class="w-title">🏁 預定完工日期</div><div class="w-val" id="totalEnd">--</div></div><div class="widget-card countdown"><div class="w-title">⏳ 距離完工剩餘天數</div><div class="w-val" id="countdownDays">--</div></div></div>
<div class="meta-grid"><div class="input-group"><label for="chartStart">設定圖表起點</label><input type="date" id="chartStart" value="2026-11-01"></div><div class="input-group"><label for="chartDays">設定圖表天數寬度</label><input type="number" id="chartDays" value="60" min="10" step="1" inputmode="numeric"></div></div>
<p class="hint">施工天數含進退場當日；倒數依台灣日期與最晚退場日計算。依表格順序比較前一工種，開始日早於前項結束日才警告；同日不警告。資料不會自動儲存。</p>
<div class="table-scroll" role="region" aria-label="施工排程，可左右捲動" tabindex="0"><table id="scheduleTable"><thead><tr><th>施工工種</th><th>進場日期 (Start)</th><th>退場日期 (End)</th><th>施工天數</th><th>工期重疊預警與備註</th><th>操作</th></tr></thead><tbody id="scheduleBody"></tbody></table></div>
<button type="button" class="btn btn-add" onclick="addRow()">＋ 新增工程排程</button>
<div class="gantt-wrapper"><div class="chart-title">📊 象合設計動態排程甘特圖 (視覺動態條)</div><p class="hint" id="chartRange"></p><div id="ganttChart"></div></div></main>
<script>
'use strict';const $=id=>document.getElementById(id),DAY=86400000,types=['保護/拆除','泥作工程','水電工程','木作工程','油漆工程','系統工程','清潔/其他'],df=[{c:'保護/拆除',s:'2026-11-01',e:'2026-11-05'},{c:'泥作工程',s:'2026-11-06',e:'2026-11-15'},{c:'水電工程',s:'2026-11-12',e:'2026-11-20'},{c:'木作工程',s:'2026-11-21',e:'2026-12-10'},{c:'油漆工程',s:'2026-12-11',e:'2026-12-25'}];let lastEnd=null;
function day(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return NaN;const t=Date.parse(s+'T00:00:00Z');return Number.isFinite(t)&&new Date(t).toISOString().slice(0,10)===s?Math.round(t/DAY):NaN}
function iso(n){return new Date(n*DAY).toISOString().slice(0,10)}
function today(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v=t=>parts.find(p=>p.type===t).value;return day(v('year')+'-'+v('month')+'-'+v('day'))}
function countdown(end,now){if(end===null)return'--';const n=Math.round(end-now);return n>0?n+' 天':n===0?'今天到期':'已逾預定完工日 '+Math.abs(n)+' 天'}
function clip(s,e,start,days){const a=Math.max(s,start),b=Math.min(e+1,start+days);return b>a?{left:(a-start)/days*100,width:(b-a)/days*100}:null}
function chartWidth(value){const n=Number(value);return Number.isFinite(n)?Math.max(10,Math.round(Math.max(0,n))):10}
function addRow(c='木作工程',s='',e=''){const tr=document.createElement('tr');tr.innerHTML='<td><select class="c" aria-label="施工工種"></select></td><td><input type="date" class="s" aria-label="進場日期"></td><td><input type="date" class="e" aria-label="退場日期"></td><td class="days">0</td><td class="warn-cell">--</td><td><button type="button" class="btn btn-del" aria-label="刪除此工程排程">刪除</button></td>';const q=x=>tr.querySelector(x);types.forEach(t=>q('.c').add(new Option(t,t)));q('.c').value=types.includes(c)?c:'木作工程';q('.s').value=s;q('.e').value=e;q('button').onclick=()=>del(q('button'));$('scheduleBody').append(tr);drawGantt()}
function del(b){b.closest('tr').remove();drawGantt()}
function updateCountdown(){$('countdownDays').textContent=countdown(lastEnd,today())}
function drawGantt(){let min=null,max=null,previous=null;const valid=[];[...$('scheduleBody').rows].forEach(row=>{const s=day(row.querySelector('.s').value),e=day(row.querySelector('.e').value),cell=row.querySelector('.warn-cell'),days=row.querySelector('.days');cell.replaceChildren();days.textContent='0 天';if(!Number.isFinite(s)||!Number.isFinite(e)){cell.textContent='請填寫有效的進退場日期';previous=null;return}if(e<s){days.textContent='錯誤';cell.textContent='退場日期不可早於進場日期';cell.className='warn-cell error';previous=null;return}cell.className='warn-cell';days.textContent=Math.round(e-s+1)+' 天';const conflict=previous!==null&&s<previous;if(conflict){const tag=document.createElement('span');tag.className='warning-tag';tag.textContent='⚠️ 工期與前一工種重疊衝突';cell.append(tag)}else cell.textContent='--';previous=e;min=min===null?s:Math.min(min,s);max=max===null?e:Math.max(max,e);valid.push({c:row.querySelector('.c').value,s,e,conflict})});$('totalStart').textContent=min===null?'--':iso(min);$('totalEnd').textContent=max===null?'--':iso(max);lastEnd=max;updateCountdown();const chart=$('ganttChart'),start=day($('chartStart').value),days=chartWidth($('chartDays').value);chart.replaceChildren();if(!Number.isFinite(start)){$('chartRange').textContent='請設定有效的圖表起點。';return}const limit=day('9999-12-31');if(days>limit-start+1){$('chartRange').textContent='圖表範圍超出可顯示日期，請縮短天數。';return}$('chartRange').textContent='顯示範圍：'+iso(start)+' 至 '+iso(start+days-1)+(valid.length?'':'｜尚無有效工程排程');valid.forEach(task=>{const row=document.createElement('div'),label=document.createElement('div'),line=document.createElement('div'),range=document.createElement('div'),part=clip(task.s,task.e,start,days);row.className='gantt-row';label.className='gantt-label';label.textContent=task.c;range.className='gantt-range';range.textContent=iso(task.s)+' ～ '+iso(task.e)+(part?'':'（不在目前圖表範圍內）');line.className='gantt-timeline';line.setAttribute('role','img');line.setAttribute('aria-label',task.c+'：'+range.textContent+(task.conflict?'，工期重疊':''));if(part){const bar=document.createElement('div');bar.className='gantt-bar'+(task.conflict?' conflict':'');bar.style.left=part.left+'%';bar.style.width=part.width+'%';line.append(bar)}row.append(label,range,line);chart.append(row)})}
$('scheduleBody').addEventListener('input',drawGantt);$('scheduleBody').addEventListener('change',drawGantt);$('chartStart').addEventListener('input',drawGantt);$('chartDays').addEventListener('input',drawGantt);$('chartDays').addEventListener('change',()=>{$('chartDays').value=chartWidth($('chartDays').value);drawGantt()});setInterval(updateCountdown,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateCountdown()});function init(){df.forEach(x=>addRow(x.c,x.s,x.e))}init();
</script></body></html>
