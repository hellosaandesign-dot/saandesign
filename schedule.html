<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>象合設計｜工程進度</title><style>:root{--primary:#55625b;--accent:#6b7a72}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f2f3ed;color:#354239;font:16px/1.8 Arial,"Microsoft JhengHei",sans-serif}.panel{width:min(100%,680px);padding:48px;background:#fcfdf9;border:1px solid #dfe5da;border-radius:18px;box-shadow:0 16px 60px #4052380c}.brand{display:flex;align-items:center;gap:14px;letter-spacing:3px}.seal{display:grid;place-items:center;background:var(--primary);color:white;width:46px;height:52px;font:32px serif;border-radius:3px}.eyebrow{margin:32px 0 8px;font-size:11px;letter-spacing:3px;color:var(--accent)}h1{font-size:32px;line-height:1.5;font-weight:500;margin:0 0 15px}p{color:#7b8877;margin:0 0 20px;font-size:14px}.actions{display:grid;gap:12px;margin:26px 0}a{display:block;padding:13px 18px;border-radius:7px;text-align:center;text-decoration:none;background:var(--primary);color:white;border:1px solid var(--primary);transition:all .25s ease;box-shadow:0 3px 10px #3542390c}a:hover{background:#435449;transform:translateY(-1px)}a:focus-visible{outline:3px solid #a8bd9d;outline-offset:4px}.secondary{background:transparent;color:var(--primary);border-color:#d8dfd1}.secondary:hover{background:#e7eddf}.note{padding-top:20px;border-top:1px solid #e2e7dc;font-size:12px;margin:0}footer{margin-top:26px;font-size:10px;letter-spacing:2px;color:#9aa48f}@media(max-width:540px){body{padding:16px}.panel{padding:28px 22px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){a{transition:none}}</style></head><body><main class="panel"><div class="brand"><span class="seal" aria-hidden="true">合</span><strong>象合設計</strong></div><div class="eyebrow">SAAN DESIGN · PRIVATE WORKSPACE</div><h1>工程進度已整合至雲端工作台</h1><p>登入後，先選擇案件，再開啟「工程進度」工具。各案件資料獨立保存。</p><div class="actions"><a href="https://saan-design-workspace.dearolm10.chatgpt.site" rel="noreferrer">登入私人工作台 →</a><a class="secondary" href="index.html">返回工作台入口</a></div><p class="note">電腦與手機請使用同一帳號登入。這裡是入口頁，案件與財務資料在私人工作台中保存。</p><footer>讓設計專注，讓管理從容。</footer></main></body></html>
